<!doctype html>
<!-- build.mjs が src/ui/main.ts をバンドルし、このプレースホルダに埋め込んで dist/ui.html を生成する -->
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 12px;
        font-family: Inter, sans-serif;
        font-size: 11px;
        color: var(--figma-color-text, #333);
        background: var(--figma-color-bg, #fff);
      }

      #progress-view,
      #result-view {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      #progress-view[hidden],
      #result-view[hidden] {
        display: none;
      }

      #progress-label {
        line-height: 1.4;
      }

      #progress-track {
        width: 100%;
        height: 6px;
        border-radius: 3px;
        background: var(--figma-color-bg-secondary, #eee);
        overflow: hidden;
      }

      #progress-fill {
        width: 0%;
        height: 100%;
        background: var(--figma-color-bg-brand, #0d99ff);
        transition: width 0.15s ease-out;
      }

      #result-status {
        line-height: 1.4;
        color: var(--figma-color-text, #333);
      }

      #result-status.is-error {
        color: var(--figma-color-text-danger, #dc3412);
      }

      #result-detail {
        line-height: 1.4;
        color: var(--figma-color-text-secondary, #666);
      }

      #close-button {
        align-self: flex-start;
        border: none;
        border-radius: 4px;
        padding: 6px 12px;
        font-family: inherit;
        font-size: 11px;
        background: var(--figma-color-bg-brand, #0d99ff);
        color: var(--figma-color-text-onbrand, #fff);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="progress-view">
      <div id="progress-label">Variable を読み込んでいます…</div>
      <div id="progress-track">
        <div id="progress-fill"></div>
      </div>
    </div>
    <div id="result-view" hidden>
      <div id="result-status"></div>
      <div id="result-detail"></div>
      <button id="close-button" type="button">閉じる</button>
    </div>
    <!-- %UI_SCRIPT% -->
  </body>
</html>
